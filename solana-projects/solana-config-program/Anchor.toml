[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
solana_config_program = "SCPQViE66wTG3jGycUvRYL4rGom7MYP1SDT2jAz8fwp"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*test.ts\""

[test]
startup_wait = 50000
shutdown_wait = 2000
